name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install protobuf tooling
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Generate frontend gRPC-Web client
      working-directory: frontend
      run: npm run proto

    - name: Build frontend
      working-directory: frontend
      run: npm run build
    
    - name: Build Story.Features (enforces analyzer rules)
      run: dotnet build tests/Story/Story.Features/Story.Features.csproj --configuration Release
    
    - name: Build Battle.Features (enforces analyzer rules)
      run: dotnet build tests/Battle/Battle.Features/Battle.Features.csproj --configuration Release
