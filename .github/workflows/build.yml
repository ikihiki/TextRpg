name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/textrpg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Aspire
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Build and push backend container images
        env:
          IMAGE_TAG: ${{ github.sha }} 
        run: aspire do push

      - name: Build and push frontend container image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: deploy/textrpg/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: tailscale configure kubeconfig text-rpg-cluster

      - name: Download Helm chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: chart/

      - uses: azure/setup-helm@v4.3.0

      - name: Compute namespace from branch (with hash)
        shell: bash
        run: |
          raw="${GITHUB_REF_NAME}"
          base="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+//; s/-+$//')"
          [ -z "$base" ] && base="pr"

          # 8桁ハッシュ（衝突しにくい）
          h="$(printf '%s' "$raw" | sha256sum | cut -c1-8)"

          # "base-h" で 63 以内に（base側を調整）
          max_base=$((63 - 1 - 8))
          base="${base:0:$max_base}"

          ns="${base}-${h}"
          echo "NAMESPACE=$ns" >> "$GITHUB_ENV"

      - name: Deploy with Helm
        run: |
          helm upgrade --install textrpg chart/ \
            --set images.corebackend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/corebackend \
            --set images.corebackend.tag=${{ github.sha }} \
            --set images.bffgateway.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bffgateway \
            --set images.bffgateway.tag=${{ github.sha }} \
            --set images.localgateway.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/localgateway \
            --set images.localgateway.tag=${{ github.sha }} \
            --set images.jobs.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/jobs \
            --set images.jobs.tag=${{ github.sha }} \
            --set images.aiorchestrator.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/aiorchestrator \
            --set images.aiorchestrator.tag=${{ github.sha }} \
            --set images.frontend.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend \
            --set images.frontend.tag=${{ github.sha }} \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --namespace ${{ env.NAMESPACE }} --create-namespace

      - name: Wait for deployments to be ready
        run: |
          kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=300s

