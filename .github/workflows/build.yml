name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal
    
    - name: Build Story.Features (enforces analyzer rules)
      run: dotnet build src/Story/Story.Features/Story.Features.csproj --configuration Release
    
    - name: Build Battle.Features (enforces analyzer rules)
      run: dotnet build src/Battle/Battle.Features/Battle.Features.csproj --configuration Release
