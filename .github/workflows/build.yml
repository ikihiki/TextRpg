name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/textrpg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Aspire
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Generate Kubernetes manifests
        run: aspire publish
        
      - name: Build and push container images
        env:
          IMAGE_TAG: ${{ github.sha }} 
        run: aspire do push

      - name: Set image values
        run: |
          for service in corebackend bffgateway localgateway jobs aiorchestrator; do
            sed -i "s|${service}_image: \".*\"|${service}_image: \"${REGISTRY}/${IMAGE_PREFIX}-${service}:${GITHUB_SHA}\"|" src/AppHost/aspire-output/values.yaml
          done

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: src/AppHost/aspire-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: tailscale configure kubeconfig text-rpg-cluster

      - name: Download manifests artifact
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifests
          path: manifests/

      - uses: azure/setup-helm@v4.3.0

      - name: Deploy helm
        run: |
          helm upgrade --install textrpg manifests \
            --set parameters.corebackend.corebackend_image=ghcr.io/ikihiki/textrpg/corebackend:${{ github.sha }} \
            --set parameters.bffgateway.bffgateway_image=ghcr.io/ikihiki/textrpg/bffgateway:${{ github.sha }} \
            --set parameters.localgateway.localgateway_image=ghcr.io/ikihiki/textrpg/localgateway:${{ github.sha }} \
            --set parameters.jobs.jobs_image=ghcr.io/ikihiki/textrpg/jobs:${{ github.sha }} \
            --set parameters.aiorchestrator.aiorchestrator_image=ghcr.io/ikihiki/textrpg/aiorchestrator:${{ github.sha }}\
            --set secrets.postgres.POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.corebackend.postgres_password="${{ secrets.POSTGRES_PASSWORD }}" \
            --namespace ${{github.head_ref}} --create-namespace

