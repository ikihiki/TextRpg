apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "textrpg.fullname" . }}-bffgateway
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: bffgateway
spec:
  replicas: {{ .Values.replicas.bffgateway }}
  selector:
    matchLabels:
      {{- include "textrpg.serviceSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bffgateway
  template:
    metadata:
      labels:
        {{- include "textrpg.serviceSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bffgateway
    spec:
      containers:
        - name: bffgateway
          image: "{{ .Values.images.bffgateway.repository }}:{{ .Values.images.bffgateway.tag }}"
          imagePullPolicy: {{ .Values.images.bffgateway.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.bffgateway }}
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.ports.bffgateway }}"
            - name: services__corebackend__http__0
              value: "http://{{ include "textrpg.fullname" . }}-corebackend:{{ .Values.ports.corebackend }}"
          resources:
            {{- toYaml .Values.resources.bffgateway | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "textrpg.fullname" . }}-bffgateway
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: bffgateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.bffgateway }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "textrpg.serviceSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bffgateway
