apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "textrpg.fullname" . }}-corebackend
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: corebackend
spec:
  replicas: {{ .Values.replicas.corebackend }}
  selector:
    matchLabels:
      {{- include "textrpg.serviceSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: corebackend
  template:
    metadata:
      labels:
        {{- include "textrpg.serviceSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: corebackend
    spec:
      containers:
        - name: corebackend
          image: "{{ .Values.images.corebackend.repository }}:{{ .Values.images.corebackend.tag }}"
          imagePullPolicy: {{ .Values.images.corebackend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.corebackend }}
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.ports.corebackend }}"
            - name: ConnectionStrings__corebackenddb
              valueFrom:
                secretKeyRef:
                  name: {{ include "textrpg.fullname" . }}-postgres
                  key: connection-string
          resources:
            {{- toYaml .Values.resources.corebackend | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "textrpg.fullname" . }}-corebackend
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: corebackend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.corebackend }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "textrpg.serviceSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: corebackend
