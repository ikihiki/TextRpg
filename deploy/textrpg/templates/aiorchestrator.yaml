apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "textrpg.fullname" . }}-aiorchestrator
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: aiorchestrator
spec:
  replicas: {{ .Values.replicas.aiorchestrator }}
  selector:
    matchLabels:
      {{- include "textrpg.serviceSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aiorchestrator
  template:
    metadata:
      labels:
        {{- include "textrpg.serviceSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: aiorchestrator
    spec:
      containers:
        - name: aiorchestrator
          image: "{{ .Values.images.aiorchestrator.repository }}:{{ .Values.images.aiorchestrator.tag }}"
          imagePullPolicy: {{ .Values.images.aiorchestrator.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.aiorchestrator }}
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.ports.aiorchestrator }}"
          resources:
            {{- toYaml .Values.resources.aiorchestrator | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "textrpg.fullname" . }}-aiorchestrator
  labels:
    {{- include "textrpg.labels" . | nindent 4 }}
    app.kubernetes.io/component: aiorchestrator
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.aiorchestrator }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "textrpg.serviceSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: aiorchestrator
