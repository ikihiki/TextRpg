# Default values for textrpg Helm chart

# Global settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []

# Image settings
images:
  corebackend:
    repository: ghcr.io/ikihiki/textrpg/corebackend
    tag: latest
    pullPolicy: IfNotPresent
  bffgateway:
    repository: ghcr.io/ikihiki/textrpg/bffgateway
    tag: latest
    pullPolicy: IfNotPresent
  localgateway:
    repository: ghcr.io/ikihiki/textrpg/localgateway
    tag: latest
    pullPolicy: IfNotPresent
  jobs:
    repository: ghcr.io/ikihiki/textrpg/jobs
    tag: latest
    pullPolicy: IfNotPresent
  aiorchestrator:
    repository: ghcr.io/ikihiki/textrpg/aiorchestrator
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/ikihiki/textrpg/frontend
    tag: latest
    pullPolicy: IfNotPresent

# Service replicas
replicas:
  corebackend: 1
  bffgateway: 1
  localgateway: 1
  jobs: 1
  aiorchestrator: 1
  frontend: 1

# Service ports
ports:
  corebackend: 8080
  bffgateway: 8080
  localgateway: 8080
  jobs: 8080
  aiorchestrator: 8080
  frontend: 80

# PostgreSQL settings
postgres:
  enabled: true
  image: postgres:16
  database: corebackenddb
  username: postgres
  # Password must be provided via --set postgres.password=<value> during deployment
  password: ""
  storage: 1Gi

# Resource limits
resources:
  corebackend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bffgateway:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  localgateway:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  jobs:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  aiorchestrator:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: textrpg.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: bffgateway
  tls: []
